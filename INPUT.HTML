<FORM>
<LABEL>FULL NAME </LABEL>
<INPUT TYPE = "TEXT"><br><br>
    <LABEL> EMAIL</LABEL>
    <INPUT TYPE = "EMAIL" name="email"><br><br>
    <LABEL> PASSWORD </LABEL>
    <INPUT TYPE = "PASSWORD" name="password"><br><br>
        <LABEL> AGE</LABEL>
        <INPUT TYPE = "NUMBER" name="age"><br><br>
        <LABEL> DATE OF BIRTH</LABEL>
        <INPUT TYPE="DATE" NAME="DATE OF BIRTH"><br><br>
            <LABEL> GENDER </LABEL>
            <INPUT TYPE="RADIO" NAME="GENDER" VALUE="MALE"> MALE
            <INPUT TYPE="RADIO" NAME="GENDER" VALUE="FEMALE"> FEMALE
            <INPUT TYPE="RADIO" NAME="GENDER" VALUE="OTHER"> OTHER<br><br>
                <LABEL> COUNTRY </LABEL>
                <SELECT NAME="COUNTRY">
                    <OPTION VALUE="INDIA">INDIA</OPTION>
                    <OPTION VALUE="USA">USA</OPTION>
                    <OPTION VALUE="UK">UK</OPTION>
                    <OPTION VALUE="CANADA">CANADA</OPTION>
                </SELECT><br><br>
                <LABEL> HOBBIES </LABEL>
                <INPUT TYPE="CHECKBOX" NAME="HOBBIES" VALUE="READING"> READING
                <INPUT TYPE="CHECKBOX" NAME="HOBBIES" VALUE="TRAVELLING"> TRAVELLING
                <INPUT TYPE="CHECKBOX" NAME="HOBBIES" VALUE="COOKING"> COOKING
                <INPUT TYPE="CHECKBOX" NAME="HOBBIES" VALUE="DANCING"> DANCING<br><br>
                    <LABEL> ADDRESS </LABEL>
                    <input type="TEXTAREA" name="address"><br><br>
                    <label> PHONE NUMBER </label>
                    <input type="TEXT" name="phone"><br><br>
                    <label>TERMS AND CONDITIONS</label>
                    <input type="checkbox" name="terms" value="accepted"><BR><BR>
                

        <label> UPLOAD PHOTO </label>
        <input type="PHOTO" name="PHOTO"><BR><BR>
        <INPUT TYPE= "SUBMIT" VALUE="SUBMIT">
            <INPUT TYPE= "RESET" VALUE="RESET"><br><br>
<label> </label>
</FORM>
