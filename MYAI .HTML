<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anuvansh's AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #111116;
            --sidebar: #191920;
            --card: #202029;
            --text: #f5f5f7;
            --muted: #a2a2b0;
            --border: #30303b;
            --accent: #8b5cf6;
        }

        body.light {
            --bg: #f7f7fb;
            --sidebar: #ededf5;
            --card: #ffffff;
            --text: #20202a;
            --muted: #666677;
            --border: #ddddE8;
            --accent: #7045db;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        button, input, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 265px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 28px;
            padding: 5px;
        }

        .logo {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #a78bfa, #6d28d9);
            font-size: 22px;
            box-shadow: 0 4px 18px #8b5cf633;
        }

        .new-chat {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 12px;
            text-align: left;
            margin-bottom: 25px;
            transition: 0.2s;
        }

        .new-chat:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .section-title {
            color: var(--muted);
            font-size: 12px;
            margin: 0 8px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            width: 100%;
            display: block;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            text-align: left;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item:hover,
        .history-item.active {
            background: var(--card);
            color: var(--text);
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .side-button {
            width: 100%;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--muted);
            text-align: left;
            border-radius: 10px;
            margin-bottom: 5px;
        }

        .side-button:hover {
            background: var(--card);
            color: var(--text);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 5px 0;
        }

        .avatar {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            color: white;
            font-weight: bold;
        }

        .profile small {
            color: var(--muted);
            display: block;
            margin-top: 4px;
        }

        /* MAIN CHAT */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid var(--border);
        }

        .topbar-title {
            font-size: 16px;
            font-weight: bold;
        }

        .topbar-right {
            display: flex;
            gap: 10px;
        }

        .icon-button {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 10px;
        }

        .icon-button:hover {
            border-color: var(--accent);
        }

        /* WELCOME SCREEN */

        .welcome {
            margin: auto;
            width: min(750px, 90%);
            text-align: center;
            padding: 35px 0;
        }

        .welcome-logo {
            width: 75px;
            height: 75px;
            display: grid;
            place-items: center;
            margin: 0 auto 25px;
            font-size: 35px;
            border-radius: 25px;
            background: linear-gradient(135deg, #a78bfa, #6d28d9);
            box-shadow: 0 10px 50px #8b5cf633;
        }

        .welcome h1 {
            font-size: clamp(28px, 4vw, 42px);
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .gradient-text {
            background: linear-gradient(90deg, #c4b5fd, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            color: transparent;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: left;
        }

        .suggestion {
            padding: 18px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 15px;
            transition: 0.2s;
        }

        .suggestion:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .suggestion strong {
            display: block;
            margin-bottom: 8px;
        }

        .suggestion span {
            color: var(--muted);
            font-size: 13px;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px 40px;
            display: none;
        }

        .messages.active {
            display: block;
        }

        .message {
            width: min(780px, 100%);
            margin: 0 auto 28px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .message-content {
            flex: 1;
            min-width: 0;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .message-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .message-text {
            white-space: pre-wrap;
        }

        .message-tools {
            margin-top: 10px;
        }

        .copy-button {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 5px 9px;
            font-size: 12px;
        }

        .copy-button:hover {
            color: var(--text);
        }

        .typing {
            color: var(--muted);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.4; }
        }

        /* MESSAGE INPUT */

        .composer-area {
            width: min(800px, 92%);
            margin: 0 auto;
            padding-bottom: 12px;
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 8px 35px #00000012;
        }

        .composer:focus-within {
            border-color: var(--accent);
        }

        .composer textarea {
            flex: 1;
            min-width: 0;
            max-height: 180px;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            padding: 9px 5px;
            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color: var(--muted);
        }

        .send-button {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: white;
            font-size: 20px;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .disclaimer {
            color: var(--muted);
            text-align: center;
            font-size: 11px;
            padding: 12px 0 0;
        }

        .mobile-menu {
            display: none;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 750px) {
            .sidebar {
                position: fixed;
                z-index: 10;
                top: 0;
                bottom: 0;
                left: -280px;
                transition: left 0.25s;
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-menu {
                display: inline-block;
            }

            .topbar {
                padding: 0 12px;
            }

            .welcome {
                padding: 20px 0;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .messages {
                padding: 20px 12px;
            }

            .message {
                gap: 10px;
            }

            .composer-area {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo">✦</div>
            <span>Anuvansh's AI</span>
        </div>

        <button class="new-chat" id="newChat">
            ＋ &nbsp; New chat
        </button>

        <div class="section-title">Recent conversations</div>

        <div class="history" id="history"></div>

        <div class="sidebar-bottom">

            <button class="side-button" id="themeButton">
                ◐ &nbsp; Change theme
            </button>

            <button class="side-button" id="clearButton">
                ⌫ &nbsp; Clear history
            </button>

            <div class="profile">
                <div class="avatar">A</div>
                <div>
                    <strong>Anuvansh Tyagi</strong>
                    <small>Personal AI assistant</small>
                </div>
            </div>

        </div>

    </aside>

    <!-- MAIN SECTION -->

    <main class="main">

        <header class="topbar">

            <div style="display:flex; align-items:center; gap:12px;">

                <button class="icon-button mobile-menu" id="menuButton">
                    ☰
                </button>

                <div class="topbar-title">
                    Anuvansh's AI <span style="color:#a78bfa">✦</span>
                </div>

            </div>

            <div class="topbar-right">
                <button class="icon-button" id="newChatTop">
                    + New chat
                </button>
            </div>

        </header>

        <!-- WELCOME -->

        <section class="welcome" id="welcome">

            <div class="welcome-logo">✦</div>

            <h1>
                Meet your own
                <span class="gradient-text">AI assistant.</span>
            </h1>

            <p>
                Welcome to Anuvansh'AI
